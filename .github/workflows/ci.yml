name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:////tmp/racepass-ci.db
      ENVIRONMENT: test
      FRONTEND_ORIGINS: http://localhost:8080
      STORAGE_MODE: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest

      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  notify:
    name: Notify Slack
    if: ${{ always() }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
    steps:
      - name: Post CI summary to Slack
        if: ${{ env.SLACK_CI_WEBHOOK_URL != '' }}
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          status="passed"
          if [ "$BACKEND_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ]; then
            status="failed"
          fi
          export status
          payload=$(python -c 'import json,os; print(json.dumps({"text": "SportPass CI *" + os.environ["status"].upper() + "*\\nBackend: " + os.environ["BACKEND_RESULT"] + "\\nFrontend: " + os.environ["FRONTEND_RESULT"] + "\\nCommit: " + os.environ["GITHUB_SHA"] + "\\nDetails: " + os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]}))' )
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_CI_WEBHOOK_URL"

name: Production database backup

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump Neon PostgreSQL to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

    steps:
      - name: Validate backup configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET"
          test -n "$R2_ENDPOINT"

      - name: Create and validate PostgreSQL dump
        id: dump
        run: |
          timestamp=$(date -u +'%Y-%m-%dT%H-%M-%SZ')
          backup_file="sportpass-${timestamp}.dump"
          docker run --rm \
            --env DATABASE_URL \
            --env BACKUP_FILE="$backup_file" \
            --volume "$PWD:/backup" \
            postgres:18-alpine \
            sh -ec 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file "/backup/$BACKUP_FILE" && pg_restore --list "/backup/$BACKUP_FILE" > /dev/null'
          sha256sum "$backup_file" > "${backup_file}.sha256"
          echo "backup_file=$backup_file" >> "$GITHUB_OUTPUT"

      - name: Upload backup to Cloudflare R2
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.backup_file }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/postgres/$BACKUP_FILE" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "${BACKUP_FILE}.sha256" "s3://$R2_BUCKET/postgres/${BACKUP_FILE}.sha256" --endpoint-url "$R2_ENDPOINT"

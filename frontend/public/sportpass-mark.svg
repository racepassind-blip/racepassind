<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="mark-title">
  <title id="mark-title">SportPass India</title>

  <!-- rounded square background -->
  <rect width="64" height="64" rx="14" fill="#101b35"/>

  <!-- ticket body -->
  <rect x="10" y="22" width="44" height="20" rx="3" fill="#ff9933"/>

  <!-- left notch cutout -->
  <circle cx="10" cy="32" r="4" fill="#101b35"/>

  <!-- right notch cutout -->
  <circle cx="54" cy="32" r="4" fill="#101b35"/>

  <!-- dashed centre divider -->
  <line x1="19" y1="32" x2="45" y2="32"
        stroke="#101b35" stroke-width="1.5"
        stroke-dasharray="3 2.5" stroke-linecap="round"/>

  <!-- three lines suggesting text on the ticket stub -->
  <rect x="22" y="25.5" width="10" height="2" rx="1" fill="#101b35" opacity="0.5"/>
  <rect x="22" y="35.5" width="14" height="2" rx="1" fill="#101b35" opacity="0.7"/>
  <rect x="22" y="38.5" width="9"  height="2" rx="1" fill="#101b35" opacity="0.4"/>
</svg>
